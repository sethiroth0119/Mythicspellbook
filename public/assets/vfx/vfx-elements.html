<script>
/* ⚡ HOST ENTRY POINT (added on install).
   ?fx=<index 0-12>&x=<0..1>&y=<0..1>&w=<px>
   x/y are NORMALISED to the viewport so the anchor survives a resize; w is the
   on-screen width of the effect box and defaults to about three tiles. */
(function () {
  try {
    var q = new URLSearchParams(location.search);
    if (!q.has('fx')) return;                       // plain preview: untouched
    document.body.classList.add('mgembed');

    /* the two controls the effect code reads every frame — forced, not removed */
    try { var gd = document.getElementById('ground'); if (gd) gd.checked = false; } catch (e) {}
    try { var lp = document.getElementById('loop');   if (lp) lp.checked = false; } catch (e) {}

    var idx = Math.max(0, Math.min(12, parseInt(q.get('fx'), 10) || 0));
    var nx  = parseFloat(q.get('x')); if (!isFinite(nx)) nx = 0.5;
    var ny  = parseFloat(q.get('y')); if (!isFinite(ny)) ny = 0.5;
    var W   = Math.max(120, parseInt(q.get('w'), 10) || 460);
    var H   = W * 562.5 / 1000;

    var cv = document.getElementById('vfx');
    var place = function () {
      try {
        var px = nx * innerWidth, py = ny * innerHeight;
        /* 500/1000 across, 380/562.5 down — the effects' own ground plane. */
        cv.style.width  = W + 'px';
        cv.style.left   = (px - W * 0.5) + 'px';
        cv.style.top    = (py - H * (380 / 562.5)) + 'px';
      } catch (e) {}
    };
    place();
    addEventListener('resize', place);

    var done = false;
    var finish = function () {
      if (done) return; done = true;
      try { parent.postMessage({ type: 'elements:complete' }, '*'); } catch (e) {}
    };
    var go = function () {
      try {
        place();
        if (window.ElementalVFX && window.ElementalVFX.play) window.ElementalVFX.play(idx);
        /* the page's own duration, plus a beat for the tail to clear */
        var ms = ((window.ElementalVFX && window.ElementalVFX.duration) || 4.2) * 1000 + 400;
        setTimeout(finish, ms);
      } catch (e) { finish(); }
    };
    if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(go, 0);
    else addEventListener('DOMContentLoaded', go);
  } catch (e) {}
})();
</script>
