<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vintrius · The Birth of Reality</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#e7f5ff;font-family:Georgia,serif}#scene{position:fixed;inset:0;overflow:hidden;background:#02050d}canvas{position:absolute;inset:0;width:100%;height:100%}#god{position:absolute;inset:-14% 0 -12%;width:100%;height:126%;object-fit:contain;mask-image:radial-gradient(ellipse at 50% 43%,#000 24%,transparent 68%);filter:saturate(.8) contrast(1.15);will-change:transform,opacity}#vignette{position:absolute;inset:0;background:radial-gradient(ellipse,transparent 30%,#01030bc9 92%);pointer-events:none}.bar{position:absolute;left:0;right:0;height:7.5%;background:#010208;z-index:4}.bar.bottom{bottom:0}.bar.top{top:0}#title{position:absolute;inset:auto 5% 12%;text-align:center;opacity:0;text-shadow:0 3px 15px #000,0 0 35px #44baff}#title small{font:10px system-ui;letter-spacing:.55em;color:#cfb67c}h1{font-weight:400;font-size:clamp(36px,6vw,86px);letter-spacing:.16em;margin:12px 0 8px}#subtitle{font-size:clamp(12px,1.6vw,20px);letter-spacing:.25em;color:#b9d2e9}#caption{position:absolute;top:12%;width:100%;text-align:center;font:10px system-ui;letter-spacing:.5em;color:#acc5df}#controls{position:fixed;z-index:8;bottom:20px;left:24px;right:24px;display:flex;align-items:center;gap:12px;font:10px system-ui;letter-spacing:.14em}button{background:#091222;color:#dbefff;border:1px solid #46657c;padding:12px 18px;cursor:pointer;font:inherit;letter-spacing:inherit}button:hover{background:#19364b}button:focus-visible{outline:2px solid #e6c581}#status{margin-left:auto;color:#9dafc1}#progress{position:absolute;bottom:0;height:2px;background:#b6dcff;box-shadow:0 0 12px #60baff}#card{position:absolute;left:50%;top:44%;height:62%;max-width:80%;object-fit:contain;transform:translate(-50%,-50%);opacity:0;filter:drop-shadow(0 0 32px #70beff)}
#god{inset:8% 0 auto;height:76%;mask-image:radial-gradient(ellipse at 50% 46%,#000 35%,transparent 76%)}#controls[hidden]{display:none}

#god{left:50%;right:auto;top:9%;width:auto;height:73%;aspect-ratio:2/3;overflow:visible;mask-image:none;filter:none;margin-left:0}
#god img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;filter:saturate(.9) contrast(1.1)}
#core{clip-path:polygon(40% 9%,65% 9%,73% 24%,74% 36%,96% 34%,98% 53%,79% 59%,73% 76%,61% 100%,41% 100%,35% 76%,10% 65%,7% 48%,18% 37%,33% 27%)}
.wing{z-index:-1;will-change:transform;backface-visibility:hidden}
.wing.left{clip-path:polygon(0 0,42% 0,43% 17%,38% 29%,28% 40%,18% 52%,22% 67%,39% 87%,25% 90%,0 69%);transform-origin:39% 35%;animation:wingLeft 4.8s ease-in-out infinite}
.wing.right{clip-path:polygon(69% 2%,100% 2%,100% 88%,72% 90%,70% 78%,80% 61%,96% 53%,97% 34%,75% 36%,70% 24%);transform-origin:72% 36%;animation:wingRight 4.8s ease-in-out infinite}
.eyes{position:absolute;left:45.2%;top:16.7%;width:8%;height:1.2%;background:radial-gradient(ellipse at 15% 60%,#eaffff 0, #62cfff 14%,transparent 37%),radial-gradient(ellipse at 77% 35%,#eaffff 0,#62cfff 15%,transparent 38%);filter:blur(1px) drop-shadow(0 0 7px #42bfff);mix-blend-mode:screen;animation:eyeLight 3.2s ease-in-out infinite;pointer-events:none}
@keyframes wingLeft{0%,100%{transform:perspective(900px) rotateY(-3deg) rotateZ(-1deg)}50%{transform:perspective(900px) rotateY(9deg) rotateZ(2deg)}}
@keyframes wingRight{0%,100%{transform:perspective(900px) rotateY(3deg) rotateZ(1deg)}50%{transform:perspective(900px) rotateY(-9deg) rotateZ(-2deg)}}
@keyframes eyeLight{0%,100%{opacity:.28}50%{opacity:.85}}
#core{clip-path:none;mask-image:radial-gradient(ellipse at 50% 46%,#000 48%,transparent 78%)}
.wing{z-index:1;mask-image:linear-gradient(transparent 1%,#000 12%,#000 70%,transparent 89%)}
.eyes{z-index:2}
@media(prefers-reduced-motion:reduce){.wing,.eyes{animation:none}}

.head{z-index:2;clip-path:ellipse(12% 8.8% at 54% 17.5%);mask-image:radial-gradient(ellipse 12% 9% at 54% 17.5%,#000 58%,transparent 100%);transform-origin:54% 25%;animation:headSway 5.6s ease-in-out infinite;will-change:transform}
.eyes{z-index:3;animation:eyeLight 3.2s ease-in-out infinite,eyeSway 5.6s ease-in-out infinite}
@keyframes headSway{0%,100%{transform:rotate(-1.3deg) translateY(0)}50%{transform:rotate(1.5deg) translateY(.22%)}}
@keyframes eyeSway{0%,100%{translate:-.18% 0}50%{translate:.35% 12%}}
@media(prefers-reduced-motion:reduce){.head,.eyes{animation:none}}
</style>
<div id="scene"><div id="god"><img id="core" alt="Vintrius holding the realms of creation"><img class="wing left" aria-hidden="true"><img class="wing right" aria-hidden="true"><img class="head" aria-hidden="true"><div class="eyes"></div></div><canvas id="fx"></canvas><img id="card" alt="Summoned ace monster" hidden><div id="vignette"></div><div class="bar top"></div><div class="bar bottom"></div><div id="caption">BEFORE EXISTENCE · THERE WAS WILL</div><div id="title"><small>ACE SUMMONED</small><h1>VINTRIUS</h1><div id="subtitle">THE APOTHEOSIS OF REALMS</div></div><div id="progress"></div></div>
<div id="controls"><button id="replay">REPLAY SUMMON</button><button id="sound">SOUND OFF</button><button id="skip">SKIP</button><span id="status">REALITY AWAKENS</span></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),embedded=parent!==window, reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas=$('fx'),ctx=canvas.getContext('2d'),god=$('god'),scene=$('scene'),card=$('card');
const core=$('core');function setArt(src){core.src=src;document.querySelectorAll('.wing,.head').forEach(img=>img.src=src);}core.onerror=()=>{core.onerror=null;setArt('Vintrius.webp');};setArt(q.get('god')||'Vintrius.webp');
const name=q.get('name');if(name&&!/vintrius/i.test(name)){$('title').querySelector('h1').textContent=name;$('subtitle').textContent='REALITY ANSWERS ITS CREATOR';$('title').querySelector('h1').style.fontSize='clamp(24px,4vw,60px)';}
if(q.get('art')){card.src=q.get('art');card.hidden=false;card.onerror=()=>{card.hidden=true;};}
if(embedded)$('controls').hidden=true;
// Canvas compositing animates the supplied illustration without altering the source asset.
let w=0,h=0,raf=0,start=0,playing=false,muted=true,audio=null,audioNodes=[];
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=clamp(x);return x*x*(3-2*x)},mix=(a,b,t)=>a+(b-a)*t;
const stars=Array.from({length:650},(_,i)=>({a:i*2.399963,r:Math.sqrt((i+.5)/650),s:.5+(i%5)*.36,z:(i%17)/17}));
function resize(){w=innerWidth;h=innerHeight;let d=Math.min(devicePixelRatio||1,1.5);canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);}addEventListener('resize',resize);resize();
function glow(x,y,r,color,alpha=1){if(r<=0)return;ctx.globalAlpha=clamp(alpha);let g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(.18,color);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.globalAlpha=1;}
function stopAudio(){audioNodes.forEach(n=>{try{n.stop();}catch{}});audioNodes=[];}
function score(){stopAudio();if(muted)return;try{audio=audio||new AudioContext();audio.resume();const now=audio.currentTime;for(const [delay,freq,end,dur,volume] of [[0,46,80,3.1,.12],[.1,138,330,3,.035],[2.5,160,950,1,.045],[3.48,90,24,1.6,.26],[3.5,880,110,1.8,.06],[4.1,164.81,164.81,2,.045],[4.1,246.94,246.94,2,.035]]){const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(freq,now+delay);o.frequency.exponentialRampToValueAtTime(end,now+delay+dur);g.gain.setValueAtTime(0,now+delay);g.gain.linearRampToValueAtTime(volume,now+delay+.06);g.gain.exponentialRampToValueAtTime(.0001,now+delay+dur);o.connect(g).connect(audio.destination);o.start(now+delay);o.stop(now+delay+dur);audioNodes.push(o);}}catch{}}
function finish(){playing=false;cancelAnimationFrame(raf);stopAudio();if(embedded){scene.style.opacity=0;parent.postMessage({type:'vintrius:complete'},location.origin);}else{$('status').textContent='SUMMON COMPLETE';}}
function render(ms){if(!playing)return;const t=Math.min((ms-start)/1000,6.4),collapse=ease((t-2.4)/1.05),burst=clamp((t-3.48)/1.3),reveal=ease((t-3.9)/.8),end=1-ease((t-6)/.4),scale=Math.max(w,h);
scene.style.opacity=embedded?end:1;ctx.clearRect(0,0,w,h);ctx.fillStyle='#02050d';ctx.fillRect(0,0,w,h);
// Artwork remains behind the transparent particle field.
canvas.style.mixBlendMode='screen';god.style.opacity=reduced?.8:mix(.1,.95,ease(t/1.6))*(1-collapse*.75+reveal*.75);god.style.transform=`translate(-50%,${reduced?0:Math.sin(t*1.4)*.65}%) scale(${reduced?1:mix(.96,1,ease(t/2.6))})`;
const cx=w*(.46+reveal*.06),cy=h*.44;
glow(cx,cy,scale*.55,'#123965',.6);ctx.save();ctx.globalCompositeOperation='lighter';
for(const s of stars){const rr=s.r*scale*.72*(1-collapse*.9+burst*1.8),a=s.a+t*.025;const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr*.68;ctx.globalAlpha=(.2+s.z*.7)*(1-ease((t-5.6)/.8)*.5);ctx.fillStyle=s.z>.7?'#ffe2a9':'#9fd6ff';if(burst>0&&burst<1&&!reduced){ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=s.s*.65;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(cx+(x-cx)*(1-burst*.32),cy+(y-cy)*(1-burst*.32));ctx.stroke();}else ctx.fillRect(x,y,s.s,s.s);}
ctx.globalAlpha=1;
// Broken orbital meridians: the geometry of reality folds into a single point.
const orbit=(1-collapse)*Math.min(w*.28,h*.32);if(orbit>1&&t<3.5){ctx.save();ctx.translate(cx,cy);ctx.rotate(t*.12);for(let j=0;j<7;j++){ctx.strokeStyle=j%2?'#528aca':'#bba16f';ctx.globalAlpha=ease(t)*.48;ctx.lineWidth=.7;ctx.beginPath();ctx.ellipse(0,0,orbit,orbit*(.24+j*.08),j*.48,t*.3+j,t*.3+j+Math.PI*1.7);ctx.stroke();}ctx.restore();for(let i=0;i<9;i++){const a=i*Math.PI*2/9+t*.22,x=cx+Math.cos(a)*orbit,y=cy+Math.sin(a)*orbit*.62;glow(x,y,18*(1-collapse)+2,i%3?'#70c9ff':'#ffcf79',ease(t));ctx.strokeStyle='#83b6dc';ctx.globalAlpha=.18;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(cx,cy);ctx.stroke();}ctx.globalAlpha=1;}
const charge=ease((t-1.7)/1.7)*(1-reveal);glow(cx,cy,20+charge*100,'#81cfff',charge);glow(cx,cy,8+charge*30,'#ffefd0',charge);
if(t>3.48){const p=t-3.48;for(let i=0;i<4;i++){const r=Math.max(0,(p-i*.095))*scale*.8;if(r>0){ctx.globalAlpha=clamp(1-p/1.8)*(.8-i*.12);ctx.strokeStyle=i%2?'#8bd9ff':'#ffdfae';ctx.lineWidth=(5-i)*Math.max(.1,1-p/2);ctx.beginPath();ctx.ellipse(cx,cy,r,r*(.42+i*.17),-.18,0,Math.PI*2);ctx.stroke();}}glow(cx,cy,scale*.75,'#77bfff',Math.exp(-p*5)*.8);if(!reduced){ctx.globalAlpha=Math.exp(-p*12)*.75;ctx.fillStyle='#e5f3ff';ctx.fillRect(0,0,w,h);}ctx.globalAlpha=1;}
ctx.restore();$('title').style.opacity=reveal; $('title').style.transform=`translateY(${(1-reveal)*24}px)`;card.style.opacity=reveal;if(!card.hidden){god.style.opacity=Number(god.style.opacity)*.35;}
$('caption').style.opacity=1-ease((t-2)/.5);$('progress').style.width=(t/6.4*100)+'%';$('status').textContent=t<2.4?'REALITY AWAKENS':t<3.48?'ALL REALMS CONVERGE':t<4.1?'THE FIRST LIGHT':'ACE SUMMONED';
if(t>=6.4){finish();return;}raf=requestAnimationFrame(render);}
function play(){cancelAnimationFrame(raf);scene.style.opacity=1;playing=true;start=performance.now();score();raf=requestAnimationFrame(render);}
$('replay').onclick=play;$('skip').onclick=finish;$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'SOUND OFF':'SOUND ON';if(muted)stopAudio();else play();};addEventListener('keydown',e=>{if(e.key==='Escape')finish();});addEventListener('pagehide',()=>{finish();audio?.close();});
window.VintriusSummon={play,stop:finish,duration:6400};
// Begin only after art is decoded; bound failed/slow loads so the game can recover.
Promise.race([core.decode().catch(()=>{}),new Promise(r=>setTimeout(r,900))]).then(play);
})();
</script>
</html>
