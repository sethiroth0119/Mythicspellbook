<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abraxas • Mother of the Cosmos</title>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03020a;color:#eee3ff;font-family:Georgia,serif}canvas{position:absolute;inset:0;width:100%;height:100%}#scene{position:absolute;inset:0;background:#03020a}#scene:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(#000 0%,transparent 15%,transparent 78%,#000 100%);box-shadow:inset 0 0 110px #0009}.top{position:absolute;top:7%;left:7%;font:10px Arial;letter-spacing:5px;color:#bc9fdb}#name{position:absolute;left:7%;bottom:13%;opacity:0;text-shadow:0 3px 20px #000}h1{font-size:clamp(38px,8vw,110px);font-weight:400;letter-spacing:.13em;margin:12px 0;background:linear-gradient(#fff9ef,#c99559);color:transparent;background-clip:text}#name small{font:10px Arial;letter-spacing:5px;color:#e4b77d}#name p{font-size:clamp(11px,1.3vw,19px);letter-spacing:.24em;color:#d0bce9;margin:0}#controls{position:absolute;bottom:25px;left:7%;right:7%;display:flex;align-items:center;gap:12px;font:10px Arial;letter-spacing:2px}button{border:1px solid #b897c655;background:#100b1ccc;color:#eadbf4;padding:10px 15px;cursor:pointer;font:10px Arial;letter-spacing:2px}#status{margin-left:auto;color:#a79ab9}#line{position:absolute;bottom:0;height:2px;background:#daa871;width:0}#error{position:absolute;top:45%;width:100%;text-align:center} @media(max-width:600px){#status{display:none}.top{letter-spacing:2px}#name{bottom:19%}}
</style>
<div id="scene"><canvas id="space"></canvas><div class="top">MYTHIC SPELLBOOK &nbsp; / &nbsp; ACE SUMMON</div><div id="name"><small>THE COSMOS BREATHES</small><h1>ABRAXAS</h1><p>MOTHER OF THE COSMOS</p></div><div id="error" hidden></div><div id="line"></div></div><div id="controls"><button id="replay">REPLAY</button><button id="sound">SOUND OFF</button><button id="skip">SKIP</button><span id="status">ENTERING THE VOID</span></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),c=$('space'),g=c.getContext('2d'),sourceArt=new Image(),art=document.createElement('canvas'),embedded=parent!==window,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)},lerp=(a,b,t)=>a+(b-a)*t;
let w,h,dpr,raf,start=0,running=false,ready=false,muted=true,audio,nodes=[];
const duration=6400,stars=Array.from({length:420},(_,i)=>({a:i*2.39996323,r:Math.sqrt((i+.5)/420),z:(i%19)/19}));
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,1.5);c.width=w*dpr;c.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function glow(x,y,r,color,alpha=1){if(r<.1)return;g.save();g.globalAlpha=clamp(alpha);const f=g.createRadialGradient(x,y,0,x,y,r);f.addColorStop(0,color);f.addColorStop(.12,color);f.addColorStop(1,'transparent');g.fillStyle=f;g.fillRect(x-r,y-r,2*r,2*r);g.restore()}
// Continuous skin weights deform one connected mesh: no duplicate cutout edges.
function deform(u,v,t){
 if(reduced)return [u,v];
 // Gentle chest expansion and vertical head lift only; hands and ribbons stay still.
 const breath=(1-Math.cos(t*Math.PI*2/3.8))*.5;
 const chest=Math.exp(-2*(((u-.54)/.12)**2+((v-.29)/.12)**2));
 const head=Math.exp(-2*(((u-.525)/.085)**2+((v-.135)/.065)**2));
 // The outer cosmic silhouette expands radially in one synchronized breath.
 // No traveling waves, rotation, hand gestures, or alternating sway.
 const aura=smooth((Math.abs(u-.53)-.105)/.23);
 const auraBreath=.014*breath*aura;
 return [u+(u-.54)*chest*.012*breath+(u-.53)*auraBreath,v-chest*.0018*breath-head*.0012*breath+(v-.47)*auraBreath*.65];
}
function triangle(a,b,c,A,B,C){const det=(b[0]-a[0])*(c[1]-a[1])-(c[0]-a[0])*(b[1]-a[1]);const xx=((B[0]-A[0])*(c[1]-a[1])-(C[0]-A[0])*(b[1]-a[1]))/det,xy=((B[1]-A[1])*(c[1]-a[1])-(C[1]-A[1])*(b[1]-a[1]))/det,yx=((C[0]-A[0])*(b[0]-a[0])-(B[0]-A[0])*(c[0]-a[0]))/det,yy=((C[1]-A[1])*(b[0]-a[0])-(B[1]-A[1])*(c[0]-a[0]))/det;g.save();g.beginPath();const mx=(A[0]+B[0]+C[0])/3,my=(A[1]+B[1]+C[1])/3;for(const [i,p] of [A,B,C].entries()){const x=p[0]+Math.sign(p[0]-mx)*.35,y=p[1]+Math.sign(p[1]-my)*.35;i?g.lineTo(x,y):g.moveTo(x,y)}g.closePath();g.clip();g.transform(xx,xy,yx,yy,A[0]-xx*a[0]-yx*a[1],A[1]-xy*a[0]-yy*a[1]);g.drawImage(art,0,0);g.restore()}
function dragon(t){const entrance=smooth(t/1.9),zoom=1,dh=Math.min(h*.97,w*1.3)*zoom,dw=dh*art.width/art.height,x=w*.58-dw*.5,y=h*.47-dh*.49;g.save();g.globalAlpha=smooth((t-.55)/1.05);const nx=16,ny=24,pts=[];for(let j=0;j<=ny;j++)for(let i=0;i<=nx;i++){const p=deform(i/nx,j/ny,t);pts.push([x+p[0]*dw,y+p[1]*dh])}for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const k=j*(nx+1)+i,a=[i/nx*art.width,j/ny*art.height],b=[(i+1)/nx*art.width,j/ny*art.height],cc=[i/nx*art.width,(j+1)/ny*art.height],d=[b[0],cc[1]];triangle(a,b,cc,pts[k],pts[k+1],pts[k+nx+1]);triangle(b,d,cc,pts[k+1],pts[k+nx+2],pts[k+nx+1])}g.restore();const mouth=deform(.525,.147,t);return [x+mouth[0]*dw,y+mouth[1]*dh]}
const planetImages=["abraxas-planet-1.webp","abraxas-planet-2.webp","abraxas-planet-3.webp"].map(src=>{const img=new Image();img.src=src;return img});
function planet(x,y,r,i,t){const img=planetImages[i];if(r<.4||!img.complete||!img.naturalWidth)return;g.save();g.translate(x,y);g.rotate(t*.12);glow(0,0,r*1.4,['#74bfff','#7edac9','#91d494'][i],.3);g.beginPath();g.arc(0,0,r,0,Math.PI*2);g.clip();g.drawImage(img,img.naturalWidth*.1,img.naturalHeight*.1,img.naturalWidth*.8,img.naturalHeight*.8,-r,-r,2*r,2*r);g.restore()}
function render(ms){if(!running)return;const t=Math.min((ms-start)/1000,6.4);draw(t);if(t>=6.4){finish();return}raf=requestAnimationFrame(render)}
const galaxy=new Image();galaxy.src='abraxas-galaxy.webp';
function draw(t){g.clearRect(0,0,w,h);g.fillStyle='#03020a';g.fillRect(0,0,w,h);if(galaxy.complete&&galaxy.naturalWidth){g.save();g.globalAlpha=.22*smooth((t-.5));g.globalCompositeOperation='screen';g.translate(w*.55,h*.45);g.rotate(-.3+t*.025);g.drawImage(galaxy,-w*.52,-w*.52,w*1.04,w*1.04);g.restore()}const size=Math.max(w,h),eat=smooth((t-1.8)/2.6);glow(w*.6,h*.4,size*.65,'#271047',.9);glow(w*.19,h*.62,size*.4,'#172951',.65);g.save();g.globalCompositeOperation='lighter';for(const s of stars){const a=s.a+t*.018,rr=((s.r+t*(reduced?0:.10)*(1-eat))%1)*size*.85,x=w*.52+Math.cos(a)*rr,y=h*.46+Math.sin(a)*rr*.64;g.globalAlpha=.2+s.z*.6;g.strokeStyle=s.z>.75?'#ffc890':'#acb7fa';g.lineWidth=.5+s.z;g.beginPath();g.moveTo(x,y);g.lineTo(x+(x-w*.52)*(reduced?0:.018)*(1-eat),y+(y-h*.46)*.018*(1-eat));g.stroke()}g.restore();
// Solar system appears behind the goddess at the moment of creation.
const birth=smooth((t-.8)/.7);g.save();g.globalAlpha=birth*.65;g.translate(w*.58,h*.45);g.rotate(-.3);for(let i=0;i<5;i++){g.strokeStyle=i%2?'#af76ed':'#72baff';g.lineWidth=1;g.beginPath();g.ellipse(0,0,w*(.12+i*.058),h*(.07+i*.037),0,0,Math.PI*2);g.stroke()}g.restore();
const mouth=dragon(t);
if(t>1.05&&t<2.15&&!reduced){const p=t-1.05;glow(w*.58,h*.4,Math.max(w,h)*(.12+p), '#d1b8ff',Math.exp(-p*5)*.95);g.save();g.globalAlpha=Math.exp(-p*4)*.8;g.fillStyle='#eee5ff';g.fillRect(0,h*.4-2,w,4);g.restore()}
// Ambient stardust drifts around the body without converging on her face.
g.save();g.globalCompositeOperation='lighter';g.globalAlpha=smooth((t-1.3)/.7)*.55;
for(let i=0;i<70;i++){const a=i*2.39996+(reduced?0:t*.045),r=size*(.19+(i%13)*.013)*(1+(reduced?0:.025*(1-Math.cos(t*Math.PI*2/3.8))*.5)),x=w*.58+Math.cos(a)*r,y=h*.46+Math.sin(a)*r*.72;glow(x,y,i%9===0?5:2,i%3?'#acbaff':'#dfacff',.55)}g.restore();
// Full-size planets remain visible and gently float in the surrounding cosmos.
for(let i=0;i<3;i++){const drift=reduced?0:t,positions=[[.20,.30],[.86,.30],[.84,.69]],x=w*(positions[i][0]+Math.sin(drift*.32+i*2)*.012),y=h*(positions[i][1]+Math.sin(drift*.7+i*1.9)*.018);g.save();g.globalAlpha=smooth((t-1.15-i*.12)/.65);planet(x,y,Math.min(w,h)*(.072-i*.009),i,drift*.3);g.restore()}
const reveal=smooth((t-4.35)/.6);$('name').style.opacity=reveal;$('name').style.transform=`translateY(${(1-reveal)*18}px)`;$('line').style.width=t/6.4*100+'%';document.body.style.opacity=embedded?1-smooth((t-6)/.4):1;$('status').textContent=t<1.8?'ENTERING THE VOID':t<4.1?'COSMIC AWAKENING':t<6.4?'ACE SUMMONED':'SUMMON COMPLETE'}
function stopAudio(){nodes.forEach(n=>{try{n.stop()}catch{}});nodes=[]}
function score(){stopAudio();if(muted)return;try{audio=audio||new AudioContext();audio.resume();for(const [delay,f0,f1,len,vol] of [[0,40,85,2,.13],[1.7,85,34,2.4,.16],[2,190,700,1.8,.035],[4.05,90,24,1.3,.2],[4.2,110,110,1.8,.04],[4.2,164.8,164.8,1.8,.03]]){const o=audio.createOscillator(),v=audio.createGain(),s=audio.currentTime+delay;o.frequency.setValueAtTime(f0,s);o.frequency.exponentialRampToValueAtTime(f1,s+len);v.gain.setValueAtTime(0,s);v.gain.linearRampToValueAtTime(vol,s+.08);v.gain.exponentialRampToValueAtTime(.0001,s+len);o.connect(v).connect(audio.destination);o.start(s);o.stop(s+len);nodes.push(o)}}catch{}}
function finish(){if(!running)return;running=false;cancelAnimationFrame(raf);stopAudio();$('status').textContent='SUMMON COMPLETE';if(embedded){$('scene').style.opacity=0;parent.postMessage({type:'abraxas:complete'},location.origin)}}
function play(){if(!ready)return;cancelAnimationFrame(raf);running=true;start=performance.now();$('scene').style.opacity=1;document.body.style.opacity=1;score();raf=requestAnimationFrame(render)}
$('replay').onclick=play;$('skip').onclick=finish;$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'SOUND OFF':'SOUND ON';muted?stopAudio():play()};addEventListener('keydown',e=>{if(e.key==='Escape')finish()});addEventListener('pagehide',()=>{finish();audio?.close()});if(embedded)$('controls').hidden=true;
window.AbraxasSummon={play,stop:finish,duration,seek(t){if(!ready)return;cancelAnimationFrame(raf);running=false;draw(Math.max(0,Math.min(6.4,t)))}};
sourceArt.onload=()=>{art.width=sourceArt.width;art.height=sourceArt.height;const ac=art.getContext('2d');ac.drawImage(sourceArt,0,0);ac.globalCompositeOperation='destination-in';const mask=ac.createRadialGradient(art.width*.52,art.height*.48,art.width*.25,art.width*.52,art.height*.48,art.height*.57);mask.addColorStop(0,'#fff');mask.addColorStop(.76,'#fff');mask.addColorStop(1,'transparent');ac.fillStyle=mask;ac.fillRect(0,0,art.width,art.height);ready=true;play()};sourceArt.onerror=()=>{$('error').hidden=false;$('error').textContent='Abraxas artwork could not load.';if(embedded){running=true;finish()}};sourceArt.src='abraxas-source.webp';
})();
</script></html>
