<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lord Gary · Gate of Zemore</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:white;font-family:system-ui}#scene{position:fixed;inset:0;background:#03040c;overflow:hidden}canvas{width:100%;height:100%;position:absolute}#unit{position:absolute;left:50%;top:50%;height:83%;max-width:95%;object-fit:contain;transform:translate(-50%,-50%);opacity:0;filter:drop-shadow(0 0 16px #8d56ca);will-change:transform,opacity}#shade{position:absolute;inset:0;background:radial-gradient(ellipse,transparent 35%,#01020ca8)}.bar{position:absolute;left:0;right:0;height:7%;background:#020309}.bottom{bottom:0}#title{position:absolute;bottom:11%;width:100%;text-align:center;opacity:0;text-shadow:0 2px 8px black,0 0 24px #a15eff}small{font-size:10px;letter-spacing:.6em;color:#83ebff}h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(28px,5.5vw,74px);letter-spacing:.14em;margin:10px}#title p{font-size:11px;letter-spacing:.4em;color:#d5bdea}#controls{position:fixed;bottom:14px;left:20px;display:flex;gap:10px;z-index:5}button{background:#111326;color:#cff5ff;border:1px solid #616184;padding:10px 18px;cursor:pointer}#error{position:absolute;top:12%;width:100%;text-align:center;color:#ffd4d4}#controls[hidden]{display:none}
</style>
<div id="scene"><canvas id="world"></canvas><canvas id="unit" role="img" aria-label="Lord Gary and his armored companion breathing as they emerge from Zemore"></canvas><canvas id="fx"></canvas><div id="shade"></div><div class="bar"></div><div class="bar bottom"></div><div id="title"><small>ACE SUMMONED</small><h1>LORD GARY</h1><p>RULER OF ZEMORE</p></div><div id="error" role="status"></div></div><div id="controls"><button id="replay">Replay summon</button><button id="skip">Skip</button></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),scene=$('scene'),unit=$('unit'),bg=$('world').getContext('2d'),fx=$('fx').getContext('2d'),q=new URLSearchParams(location.search),embedded=parent!==window,reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const city=new Image(),art=new Image(),body=unit.getContext('2d');
let w,h,start,raf=0,done=false;const duration=6.35,clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=clamp(x);return x*x*(3-2*x)};
function resize(){w=innerWidth;h=innerHeight;for(const c of [bg,fx]){const d=Math.min(devicePixelRatio||1,1.5);c.canvas.width=w*d;c.canvas.height=h*d;c.setTransform(d,0,0,d,0,0)}}addEventListener('resize',resize);resize();
function end(){done=true;cancelAnimationFrame(raf);scene.style.opacity=0;if(embedded)parent.postMessage({type:'lord-gary-cinematic-ended'},location.origin)}
function line(c,x,y,X,Y,color,width=1){c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.strokeStyle=color;c.lineWidth=width;c.stroke()}
function ring(c,x,y,r,sy,color,width,rotation=0,dash=[]){c.save();c.translate(x,y);c.scale(1,sy);c.rotate(rotation);c.beginPath();c.arc(0,0,Math.max(1,r),0,Math.PI*2);c.strokeStyle=color;c.lineWidth=width;c.setLineDash(dash);c.stroke();c.restore()}
// A continuous deformation mesh moves each chest and head independently without cutout seams.
function breathe(t){
 const W=art.naturalWidth,H=art.naturalHeight;if(!W)return;
 body.clearRect(0,0,W,H);
 const cat=reduced?0:Math.sin(t*2.5+.6),man=reduced?0:Math.sin(t*1.85),sway=reduced?0:Math.sin(t*1.15);
 const bell=(x,y,cx,cy,rx,ry)=>Math.exp(-(((x-cx)/rx)**2+((y-cy)/ry)**2));
 function point(x,y){const u=x/W,v=y/H;
  const cc=bell(u,v,.30,.51,.23,.19),mc=bell(u,v,.79,.40,.18,.16),ch=bell(u,v,.23,.32,.20,.14),mh=bell(u,v,.80,.23,.11,.10),cape=bell(u,v,.94,.66,.12,.23);
  return [x+W*(cat*.008*(u-.30)*cc+man*.01*(u-.79)*mc+sway*.0025*mh+Math.sin(t*2)*.003*cape*(reduced?0:1)),y-H*(cat*.0045*cc+man*.0035*mc+cat*.0028*ch+man*.002*mh)];
 }
 function triangle(src,dst){
  const [a,b,c]=src,[A,B,C]=dst,den=(b[0]-a[0])*(c[1]-a[1])-(c[0]-a[0])*(b[1]-a[1]);
  const m0=((B[0]-A[0])*(c[1]-a[1])-(C[0]-A[0])*(b[1]-a[1]))/den,m2=((C[0]-A[0])*(b[0]-a[0])-(B[0]-A[0])*(c[0]-a[0]))/den;
  const m1=((B[1]-A[1])*(c[1]-a[1])-(C[1]-A[1])*(b[1]-a[1]))/den,m3=((C[1]-A[1])*(b[0]-a[0])-(B[1]-A[1])*(c[0]-a[0]))/den;
  body.save();body.beginPath();const mx=(A[0]+B[0]+C[0])/3,my=(A[1]+B[1]+C[1])/3;
  // Slightly overlap adjacent clips to avoid antialiased hairline cracks.
  for(let i=0;i<3;i++){const p=dst[i],dx=p[0]-mx,dy=p[1]-my,l=Math.hypot(dx,dy);body[i?'lineTo':'moveTo'](p[0]+dx/l*.35,p[1]+dy/l*.35)}body.closePath();body.clip();
  body.setTransform(m0,m1,m2,m3,A[0]-m0*a[0]-m2*a[1],A[1]-m1*a[0]-m3*a[1]);body.drawImage(art,0,0);body.restore();
 }
 if(reduced){body.drawImage(art,0,0);return}
 const cols=16,rows=24;
 for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const x=i*W/cols,y=j*H/rows,X=(i+1)*W/cols,Y=(j+1)*H/rows,a=[x,y],b=[X,y],c=[X,Y],d=[x,Y],A=point(...a),B=point(...b),C=point(...c),D=point(...d);triangle([a,b,c],[A,B,C]);triangle([a,c,d],[A,C,D])}
}
function frame(now){if(done)return;let t=q.has('time')?Math.max(0,Math.min(duration,Number(q.get('time'))||0)):(now-start)/1000;if(reduced)t=4.8+(now-start)/1000;const opening=ease((t-.3)/1.25),advance=ease((t-1.55)/2.15),cx=w*.5,cy=h*.46,r=Math.min(w*.37,h*.48)*opening;
breathe(t);bg.clearRect(0,0,w,h);fx.clearRect(0,0,w,h);scene.style.opacity=1-ease((t-5.85)/.5);
// The city exists only inside the portal aperture; its independent parallax sells depth.
bg.save();bg.beginPath();bg.ellipse(cx,cy,Math.max(1,r),Math.max(1,r*.93),0,0,Math.PI*2);bg.clip();const sky=bg.createLinearGradient(0,cy-r,0,cy+r);sky.addColorStop(0,'#091732');sky.addColorStop(.6,'#345d8a');sky.addColorStop(1,'#9c72bb');bg.fillStyle=sky;bg.fillRect(0,0,w,h);
if(city.complete&&city.naturalWidth){
// Cover the aperture with the cinematic city, gently pushing into the other world.
const base=Math.min(w*.37,h*.48),zoom=reduced?1.05:1.05+.035*ease(t/5.8),scale=Math.max(base*2/city.naturalWidth,base*1.86/city.naturalHeight)*zoom,dw=city.naturalWidth*scale,dh=city.naturalHeight*scale;
bg.drawImage(city,cx-dw/2+(reduced?0:Math.sin(t*.25)*base*.018),cy-dh/2,dw,dh);
}
bg.restore();
// Perspective floor and rotating mechanical portal rings.
bg.globalAlpha=opening*.4;for(let i=-12;i<=12;i++)line(bg,cx,cy+r*.8,cx+i*w*.15,h,'#6354a6');for(let i=0;i<6;i++){const y=h*.75+i*i*h*.01;line(bg,0,y,w,y,'#4b417d')}bg.globalAlpha=1;
fx.shadowBlur=18;fx.shadowColor='#8c58ff';ring(fx,cx,cy,r,.93,'#be91ff',5);ring(fx,cx,cy,r+9,.93,'#74e9ff',2,-t*.3,[16,12,3,12]);ring(fx,cx,cy,r+20,.93,'#745bbf',7,t*.13,[40,15]);fx.shadowBlur=0;
for(let i=0;i<95;i++){const a=i*2.399+t*.1,rr=r+10+((i*19+t*32)%120),x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr*.93;fx.globalAlpha=opening*(1-((i*19+t*32)%120)/120);line(fx,x,y,x+Math.cos(a)*9,y+Math.sin(a)*9,i%2?'#bc8fff':'#8feaff',i%3?1:2)}fx.globalAlpha=1;
const impact=ease((t-3.45)/.7);if(t>3.45&&t<4.3){fx.globalAlpha=1-impact;ring(fx,cx,h*.84,w*.6*impact,.22,'#ccb8ff',5);fx.globalAlpha=1}
const shake=!reduced&&t>3.45&&t<3.8?Math.sin(t*110)*4*(1-(t-3.45)/.35):0;unit.style.opacity=ease((t-1.4)/.55);unit.style.transform=`translate(calc(-50% + ${shake}px),calc(-50% + ${(1-advance)*-h*.08}px)) scale(${.28+.72*advance})`;unit.style.filter=`brightness(${.3+.7*advance}) drop-shadow(0 0 ${12+10*(1-advance)}px #ac79ed)`;
$('title').style.opacity=ease((t-3.8)/.55);$('title').style.transform=`translateY(${(1-ease((t-3.8)/.6))*18}px)`;
if(!q.has('time')&&t>=duration){end();return}if(!q.has('time'))raf=requestAnimationFrame(frame)}
function play(){cancelAnimationFrame(raf);done=false;start=performance.now();raf=requestAnimationFrame(frame)}
$('replay').onclick=play;$('skip').onclick=end;addEventListener('keydown',e=>{if(e.key==='Escape')end()});if(embedded)$('controls').hidden=true;
let unitReady=false,cityReady=false;function ready(){if(unitReady&&cityReady)play()}
city.onload=()=>{cityReady=true;ready()};city.onerror=()=>{cityReady=true;$('error').textContent='City artwork unavailable.';ready()};city.src='lord-gary-city.webp';
art.onload=()=>{unit.width=art.naturalWidth;unit.height=art.naturalHeight;unit.style.width='auto';unit.style.aspectRatio=art.naturalWidth+'/'+art.naturalHeight;unitReady=true;ready()};art.onerror=()=>{$('error').textContent='Lord Gary artwork could not load.';setTimeout(end,1800)};art.src=q.get('unit')||'lord-gary-unit.webp';
addEventListener('pagehide',()=>{cancelAnimationFrame(raf);removeEventListener('resize',resize)});
})();
</script></html>
